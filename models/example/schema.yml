
version: 2

models:
    - name: my_first_dbt_model
      description: "A starter dbt model"
      columns:
          - name: id
            description: "The primary key for this table"
            tests:
                - unique
                - not_null

    - name: my_second_dbt_model
      description: "A starter dbt model"
      columns:
          - name: id
            description: "The primary key for this table"
            tests:
                - unique
                - not_null

    
    - name: profit_us
      description: "This model calculates the total revenue, total cost, and total profit for sales."
      columns:
          - name: sales_date
            description: "The date of the sale."
            tests:
                - not_null
                - unique
          
          - name: total_revenue
            description: "The total revenue generated from sales."
            tests:
                - not_null

          - name: total_cost
            description: "The total cost of goods sold."
            tests:
                - not_null

          - name: total_profit
            description: "The total profit, calculated as revenue minus cost."
            tests:
                - not_null

    
    - name: demo
      description: "Transform QUANTITY_SOLD by multiplying it by 2"
      columns:
        - name: QUANTITY_SOLD
          description: "Doubled quantity sold"
          tests:
            - not_null